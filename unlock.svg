@import url('https://fonts.googleapis.com/css2?family=Roboto&family=Roboto+Mono&display=swap');

:root{
    --branco: white;
    --cor-de-fundo: #00162E;
    --fundo-senha: #00244D;
    --fundo-texto: #001E40;
    --borda: #0075FF;
    --roboto: 'Roboto', sans-serif;
    --roboto-mono: 'Roboto Mono', monospace;
    --fraca: #E71B32;
    --media: #FAF408;
    --forte: #00FF85;
}

*{
    font-weight: 400;
    box-sizing: border-box;
}

body{
    color: var(--branco);
    background-color: var(--cor-de-fundo);
    font-family: var(--roboto);
    margin: 0;
    padding: 0 16px 40px;
}

.titulo-principal{
    font-family: var(--roboto-mono);
    font-size: 32px;
    margin: 16px 0 8px;
}

.titulo-secundario{
    font-size: 18px;
    font-weight: 400;
    opacity: 0.9;
}

.conteudo-titulo{
    text-align: center;
    margin-top: 60px;
}

.conteudo-titulo img{
    width: 48px;
    height: 48px;
}

.conteudo-senha{
    margin-top: 48px; 
    background: var(--fundo-senha);
    padding: 24px;
    border-bottom: 6px solid var(--borda);
    border-radius: 4px 4px 0 0;
}

.conteudo-senha label{
    display: block;
    margin-bottom: 12px;
    font-size: 14px;
    opacity: 0.8;
}

.senha-container{
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

#campo-senha{
    background-color: transparent;
    border: none;
    color: var(--branco);
    font-family: var(--roboto-mono);
    font-size: 28px;
    width: 70%;
    min-width: 200px;
    letter-spacing: 1px;
}

#campo-senha:focus{
    outline: none;
}

#botao-copiar{
    background-color: var(--borda);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-family: var(--roboto);
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
}

#botao-copiar:hover{
    background-color: #005ecc;
}

#botao-copiar:active{
    transform: scale(0.97);
}

.conteudo{
    max-width: 1100px;
    margin: 0 auto;
}

.parametro{
    background-color: var(--fundo-texto);
    border: 2px solid var(--borda);
    margin-top: 32px;
    padding: 24px;
    border-radius: 8px;
}

.parametro-titulo{
    font-family: var(--roboto-mono);
    font-size: 24px;
    margin-top: 0;
    margin-bottom: 28px;
}

.parametro-senha__titulo{
    font-size: 18px;
    margin-bottom: 16px;
    font-family: var(--roboto-mono);
}

.parametro-coluna__senha{
    display: flex;
    flex-direction: column;
    gap: 32px;
}

.parametro-senha{
    width: 100%;
}

/* Botões de tamanho */
.parametro-senha-botoes{
    display: flex;
    align-items: center;
    gap: 16px;
}

.parametro-senha__botao{
    width: 40px;
    height: 40px;
    border: 2px solid var(--borda);
    background-color: transparent;
    color: var(--branco);
    font-size: 24px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s, color 0.2s;
    line-height: 1;
    padding: 0;
}

.parametro-senha__botao:hover{
    background-color: var(--borda);
}

.parametro-senha__texto{
    font-family: var(--roboto-mono);
    font-size: 28px;
    margin: 0;
    min-width: 40px;
    text-align: center;
}

/* Checkboxes */
.parametro-senha-checkbox{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.parametro-senha-checkbox input[type="checkbox"]{
    width: 20px;
    height: 20px;
    accent-color: var(--borda);
    cursor: pointer;
}

.parametro-senha-checkbox label{
    cursor: pointer;
    font-size: 16px;
}

/* Força da senha */
.forca-container{
    height: 8px;
    background-color: #0a2a4a;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
}

.barra-forca{
    height: 100%;
    width: 100%;
    background-color: var(--forte);
    border-radius: 4px;
    transition: width 0.3s ease, background-color 0.3s ease;
}

.parametro-senha__textos{
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 8px;
}

.forca-texto{
    font-family: var(--roboto-mono);
    font-size: 18px;
    margin: 0;
    color: var(--forte);
    transition: color 0.3s ease;
}

@media screen and (min-width: 768px) {
    .parametro-coluna__senha{
        flex-direction: row;
        gap: 24px;
    }

    .parametro-senha{
        width: 33%;
        margin: 0;
    }

    #campo-senha{
        font-size: 36px;
    }

    .titulo-secundario{
        font-size: 22px;
    }
}
